<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Thu Chi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24312C">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
<style>
  :root{
    --bg:#ECE7D8;
    --surface:#F7F4EA;
    --surface-2:#FFFDF6;
    --ink:#24312C;
    --ink-soft:#5B675F;
    --line:#C9C2A8;
    --income:#2F6B4F;
    --income-soft:#E4ECE5;
    --expense:#9C3B2E;
    --expense-soft:#F3E4DF;
    --gold:#B8892B;
    --font-serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
    --font-mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);}
  body{
    min-height:100vh;
    padding:calc(20px + env(safe-area-inset-top,0px)) clamp(14px,4vw,40px) calc(60px + env(safe-area-inset-bottom,0px));
  }

  header.app-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:12px;
  }
  header.app-header h1{
    font-family:var(--font-serif);font-weight:600;font-size:clamp(26px,3vw,34px);
    margin:0;letter-spacing:.2px;
  }
  header.app-header p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}
  .month-select-wrap{display:flex;align-items:center;gap:8px;}
  .month-select-wrap label{font-size:13px;color:var(--ink-soft);}
  select, input, button{font-family:inherit;font-size:14px;}
  select, input{
    background:var(--surface-2);border:1px solid var(--line);border-radius:3px;
    padding:7px 9px;color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--gold);outline-offset:1px;}

  .layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:24px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:20px;
  }
  .panel + .panel{margin-top:20px;}

  /* Balance stamp */
  .balance-panel{
    background:var(--surface-2);
    border:2px solid var(--gold);
    border-radius:6px;
    padding:22px 20px;
    position:relative;
  }
  .balance-panel::before{
    content:"SỐ DƯ HIỆN TẠI";
    display:block;font-size:11px;letter-spacing:1.5px;color:var(--gold);
    font-weight:700;margin-bottom:8px;
  }
  .balance-amount{
    font-family:var(--font-serif);font-size:clamp(28px,3.4vw,38px);font-weight:600;
    line-height:1.1;word-break:break-word;
  }
  .balance-amount.negative{color:var(--expense);}
  .balance-sub{margin-top:10px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap;}
  .balance-sub span b{color:var(--ink);}
  .initial-balance-row{
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
    display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);
    flex-wrap:wrap;gap:6px;
  }
  .initial-balance-row b{color:var(--ink);font-family:var(--font-mono);}
  .link-btn{
    background:none;border:none;color:var(--gold);font-weight:600;cursor:pointer;
    font-size:12.5px;padding:2px 0;text-decoration:underline;
  }

  h2.section-title{
    font-family:var(--font-serif);font-size:17px;font-weight:600;margin:0 0 14px;
  }

  form#txn-form{display:flex;flex-direction:column;gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12.5px;color:var(--ink-soft);}
  .type-toggle{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .type-toggle button{
    flex:1;padding:8px 0;background:var(--surface-2);border:none;cursor:pointer;
    color:var(--ink-soft);font-weight:600;
  }
  .type-toggle button.active[data-type="income"]{background:var(--income-soft);color:var(--income);}
  .type-toggle button.active[data-type="expense"]{background:var(--expense-soft);color:var(--expense);}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:480px){ .row-2{grid-template-columns:1fr;} }
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll table{min-width:560px;}
  @media (max-width:600px){
    td.actions button{padding:6px 10px;font-size:13px;}
  }
  button.primary{
    margin-top:4px;background:var(--ink);color:var(--surface);border:none;
    padding:10px 14px;border-radius:4px;cursor:pointer;font-weight:600;letter-spacing:.2px;
  }
  button.primary:hover{background:#152019;}
  .form-msg{font-size:12.5px;color:var(--expense);min-height:16px;}

  /* filters */
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .filters-row .field{flex:0 0 auto;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:.4px;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding:6px 8px;font-weight:600;
  }
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:hover{background:rgba(0,0,0,0.02);}
  td{padding:9px 8px;vertical-align:top;}
  td.amount{font-family:var(--font-mono);text-align:right;white-space:nowrap;}
  td.amount.income{color:var(--income);}
  td.amount.expense{color:var(--expense);}
  td.actions{text-align:right;white-space:nowrap;}
  td.actions button{
    background:none;border:1px solid var(--line);border-radius:3px;padding:3px 8px;
    margin-left:4px;cursor:pointer;font-size:12px;color:var(--ink-soft);
  }
  td.actions button:hover{border-color:var(--ink);color:var(--ink);}
  .tag{
    display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;
  }
  .tag.income{background:var(--income-soft);color:var(--income);}
  .tag.expense{background:var(--expense-soft);color:var(--expense);}
  .empty-state{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
  @media (max-width:700px){.two-col{grid-template-columns:1fr;}}

  .cat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cat-bar-row .cat-label{flex:0 0 100px;font-size:12.5px;color:var(--ink-soft);}
  .cat-bar-track{flex:1;background:var(--line);height:8px;border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--expense);border-radius:4px;}
  .cat-bar-val{flex:0 0 auto;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}

  .toolbar-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap;}
  .ghost-btn{
    background:none;border:1px solid var(--line);color:var(--ink-soft);
    padding:7px 12px;border-radius:4px;cursor:pointer;font-size:12.5px;
  }
  .ghost-btn:hover{border-color:var(--ink);color:var(--ink);}
  #import-file{display:none;}

  svg.trend text{font-family:var(--font-sans);}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B211C; --surface:#232B24; --surface-2:#2A332B; --ink:#EAE6D8; --ink-soft:#9BA79C;
      --line:#3B453C; --income:#7FC49B; --income-soft:#25322A; --expense:#E38A78; --expense-soft:#33241F;
      --gold:#D8AE5C;
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1>Sổ Thu Chi</h1>
    <p>Ghi lại và theo dõi dòng tiền ra vào — lưu trên máy này, không cần mạng.</p>
  </div>
  <div class="month-select-wrap">
    <label for="month-filter">Xem theo tháng</label>
    <select id="month-filter"></select>
  </div>
</header>

<div class="layout">
  <div>
    <div class="balance-panel">
      <div class="balance-amount" id="balance-amount">0 đ</div>
      <div class="balance-sub">
        <span>Tổng thu: <b id="all-time-income">0 đ</b></span>
        <span>Tổng chi: <b id="all-time-expense">0 đ</b></span>
      </div>
      <div class="initial-balance-row">
        <span>Số dư ban đầu: <b id="initial-balance-display">0 đ</b></span>
        <button type="button" class="link-btn" id="edit-initial-btn">Đặt / sửa</button>
      </div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h2 class="section-title">Thêm giao dịch</h2>
      <form id="txn-form">
        <div class="type-toggle">
          <button type="button" data-type="income" class="active">Khoản thu</button>
          <button type="button" data-type="expense">Khoản chi</button>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="f-date">Ngày</label>
            <input type="date" id="f-date" required>
          </div>
          <div class="field">
            <label for="f-amount">Số tiền (đ)</label>
            <input type="number" id="f-amount" min="0" step="1" inputmode="numeric" placeholder="0" required>
          </div>
        </div>
        <div class="field">
          <label for="f-category">Danh mục</label>
          <select id="f-category"></select>
        </div>
        <div class="field">
          <label for="f-note">Ghi chú (không bắt buộc)</label>
          <input type="text" id="f-note" placeholder="Ví dụ: ăn trưa với bạn">
        </div>
        <div class="form-msg" id="form-msg"></div>
        <button type="submit" class="primary" id="submit-btn">Lưu giao dịch</button>
      </form>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="filters-row">
        <div class="field">
          <label for="type-filter">Loại</label>
          <select id="type-filter">
            <option value="all">Tất cả</option>
            <option value="income">Khoản thu</option>
            <option value="expense">Khoản chi</option>
          </select>
        </div>
        <div class="field">
          <label for="cat-filter">Danh mục</label>
          <select id="cat-filter"><option value="all">Tất cả</option></select>
        </div>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>Ngày</th><th>Loại</th><th>Danh mục</th><th>Ghi chú</th><th style="text-align:right;">Số tiền</th><th></th></tr>
          </thead>
          <tbody id="txn-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">Chưa có giao dịch nào trong khoảng đang xem.</div>

      <div class="toolbar-bottom">
        <span id="row-count" style="font-size:12.5px;color:var(--ink-soft);"></span>
        <div>
          <button class="ghost-btn" id="export-btn">Xuất dữ liệu (.json)</button>
          <button class="ghost-btn" id="import-btn">Nhập dữ liệu</button>
          <input type="file" id="import-file" accept="application/json">
        </div>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <h2 class="section-title">Cơ cấu chi tiêu (tháng đang xem)</h2>
        <div id="cat-breakdown"></div>
      </div>
      <div class="panel">
        <h2 class="section-title">Xu hướng 6 tháng gần đây</h2>
        <div id="trend-chart"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "so_thu_chi_transactions_v1";
  const INITIAL_BAL_KEY = "so_thu_chi_initial_balance_v1";
  const CATS = {
    income: ["Lương","Học bổng","Thưởng","Được cho/tặng","Khác"],
    expense: ["Ăn uống","Nhà ở","Di chuyển","Học tập","Giải trí","Sức khoẻ","Khác"]
  };

  let txns = [];
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    txns = raw ? JSON.parse(raw) : [];
  }catch(e){ txns = []; }

  let initialBalance = 0;
  try{
    const rawInit = localStorage.getItem(INITIAL_BAL_KEY);
    initialBalance = rawInit ? parseFloat(rawInit) : 0;
    if(isNaN(initialBalance)) initialBalance = 0;
  }catch(e){ initialBalance = 0; }

  let currentType = "income";
  let filterMonth = "all";
  let filterType = "all";
  let filterCat = "all";

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toLocaleString('vi-VN') + " đ";
  const todayStr = () => new Date().toISOString().slice(0,10);

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(txns)); }
    catch(e){ $('form-msg').textContent = "Không thể lưu dữ liệu vào bộ nhớ trình duyệt."; }
  }

  function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM

  function populateCategorySelect(){
    const sel = $('f-category');
    sel.innerHTML = "";
    CATS[currentType].forEach(c=>{
      const o = document.createElement('option'); o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  }

  function setType(t){
    currentType = t;
    document.querySelectorAll('.type-toggle button').forEach(b=>{
      b.classList.toggle('active', b.dataset.type === t);
    });
    populateCategorySelect();
  }

  document.querySelectorAll('.type-toggle button').forEach(b=>{
    b.addEventListener('click', ()=> setType(b.dataset.type));
  });

  $('f-date').value = todayStr();

  $('txn-form').addEventListener('submit', function(e){
    e.preventDefault();
    const date = $('f-date').value;
    const amount = parseFloat($('f-amount').value);
    const category = $('f-category').value;
    const note = $('f-note').value.trim();
    $('form-msg').textContent = "";

    if(!date){ $('form-msg').textContent = "Vui lòng chọn ngày."; return; }
    if(!amount || amount <= 0){ $('form-msg').textContent = "Số tiền phải lớn hơn 0."; return; }

    txns.push({ id: uid(), date, type: currentType, category, amount, note });
    save();
    $('f-amount').value = "";
    $('f-note').value = "";
    $('f-date').value = todayStr();
    renderAll();
  });

  function deleteTxn(id){
    txns = txns.filter(t => t.id !== id);
    save();
    renderAll();
  }

  function editTxn(id){
    const t = txns.find(x=>x.id===id);
    if(!t) return;
    const newAmount = prompt("Sửa số tiền:", t.amount);
    if(newAmount === null) return;
    const val = parseFloat(newAmount);
    if(!val || val <= 0){ alert("Số tiền không hợp lệ."); return; }
    t.amount = val;
    const newNote = prompt("Sửa ghi chú:", t.note || "");
    if(newNote !== null) t.note = newNote.trim();
    save();
    renderAll();
  }

  function buildMonthOptions(){
    const months = new Set(txns.map(t=>monthKey(t.date)));
    const sorted = Array.from(months).sort().reverse();
    const sel = $('month-filter');
    const prev = sel.value || filterMonth;
    sel.innerHTML = '<option value="all">Tất cả thời gian</option>';
    sorted.forEach(m=>{
      const [y,mo] = m.split('-');
      const o = document.createElement('option');
      o.value = m; o.textContent = `Tháng ${parseInt(mo,10)}/${y}`;
      sel.appendChild(o);
    });
    if(prev && (prev === 'all' || sorted.includes(prev))) sel.value = prev;
    filterMonth = sel.value;
  }

  function buildCatFilterOptions(){
    const sel = $('cat-filter');
    const prev = sel.value;
    const all = Array.from(new Set(txns.map(t=>t.category))).sort();
    sel.innerHTML = '<option value="all">Tất cả</option>';
    all.forEach(c=>{
      const o = document.createElement('option'); o.value=c; o.textContent=c;
      sel.appendChild(o);
    });
    if(all.includes(prev)) sel.value = prev;
    filterCat = sel.value;
  }

  $('month-filter').addEventListener('change', e=>{ filterMonth = e.target.value; renderAll(); });
  $('type-filter').addEventListener('change', e=>{ filterType = e.target.value; renderAll(); });
  $('cat-filter').addEventListener('change', e=>{ filterCat = e.target.value; renderAll(); });

  function getFilteredTxns(){
    return txns.filter(t=>{
      if(filterMonth !== 'all' && monthKey(t.date) !== filterMonth) return false;
      if(filterType !== 'all' && t.type !== filterType) return false;
      if(filterCat !== 'all' && t.category !== filterCat) return false;
      return true;
    }).sort((a,b)=> b.date.localeCompare(a.date));
  }

  function renderBalance(){
    let allIncome = 0, allExpense = 0;
    txns.forEach(t=>{ if(t.type==='income') allIncome += t.amount; else allExpense += t.amount; });
    const balance = initialBalance + allIncome - allExpense;
    const el = $('balance-amount');
    el.textContent = fmt(balance);
    el.classList.toggle('negative', balance < 0);
    $('all-time-income').textContent = fmt(allIncome);
    $('all-time-expense').textContent = fmt(allExpense);
    $('initial-balance-display').textContent = fmt(initialBalance);
  }

  $('edit-initial-btn').addEventListener('click', ()=>{
    const input = prompt("Nhập số dư ban đầu (số tiền bạn đang có trước khi bắt đầu ghi sổ):", initialBalance);
    if(input === null) return;
    const val = parseFloat(input.replace(/[^0-9.-]/g,''));
    if(isNaN(val)){ alert("Vui lòng nhập một con số hợp lệ."); return; }
    initialBalance = val;
    try{ localStorage.setItem(INITIAL_BAL_KEY, String(initialBalance)); }catch(e){}
    renderAll();
  });

  function renderTable(){
    const rows = getFilteredTxns();
    const tbody = $('txn-body');
    tbody.innerHTML = "";
    $('empty-state').style.display = rows.length ? 'none' : 'block';
    $('row-count').textContent = rows.length ? `${rows.length} giao dịch` : "";

    rows.forEach(t=>{
      const tr = document.createElement('tr');
      const [y,m,d] = t.date.split('-');
      tr.innerHTML = `
        <td>${d}/${m}/${y}</td>
        <td><span class="tag ${t.type}">${t.type==='income'?'Thu':'Chi'}</span></td>
        <td>${escapeHtml(t.category)}</td>
        <td>${escapeHtml(t.note||'')}</td>
        <td class="amount ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</td>
        <td class="actions">
          <button data-act="edit" data-id="${t.id}">Sửa</button>
          <button data-act="del" data-id="${t.id}">Xoá</button>
        </td>`;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('button[data-act="del"]').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(confirm('Xoá giao dịch này?')) deleteTxn(b.dataset.id);
      });
    });
    tbody.querySelectorAll('button[data-act="edit"]').forEach(b=>{
      b.addEventListener('click', ()=> editTxn(b.dataset.id));
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderCategoryBreakdown(){
    const rows = getFilteredTxns().filter(t=>t.type==='expense');
    const totals = {};
    rows.forEach(t=>{ totals[t.category] = (totals[t.category]||0) + t.amount; });
    const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
    const container = $('cat-breakdown');
    container.innerHTML = "";
    if(!entries.length){
      container.innerHTML = '<div class="empty-state" style="padding:10px 0;">Không có khoản chi nào để thống kê.</div>';
      return;
    }
    const max = entries[0][1];
    entries.forEach(([cat, val])=>{
      const row = document.createElement('div');
      row.className = 'cat-bar-row';
      row.innerHTML = `
        <div class="cat-label">${escapeHtml(cat)}</div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(val/max*100).toFixed(1)}%"></div></div>
        <div class="cat-bar-val">${fmt(val)}</div>`;
      container.appendChild(row);
    });
  }

  function renderTrendChart(){
    const now = new Date();
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label: `T${d.getMonth()+1}` });
    }
    const sums = months.map(m=>{
      let inc=0, exp=0;
      txns.forEach(t=>{ if(monthKey(t.date)===m.key){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; } });
      return { ...m, inc, exp };
    });
    const maxVal = Math.max(1, ...sums.map(s=>Math.max(s.inc,s.exp)));
    const W = 340, H = 160, padL = 8, padB = 24, barGroupW = (W-padL*2)/6, barW = 14;
    let svg = `<svg class="trend" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padL}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/>`;
    sums.forEach((s,i)=>{
      const gx = padL + i*barGroupW + barGroupW/2;
      const incH = (s.inc/maxVal) * (H-padB-14);
      const expH = (s.exp/maxVal) * (H-padB-14);
      svg += `<rect x="${gx-barW-1}" y="${H-padB-incH}" width="${barW}" height="${incH}" fill="var(--income)" rx="1.5"/>`;
      svg += `<rect x="${gx+1}" y="${H-padB-expH}" width="${barW}" height="${expH}" fill="var(--expense)" rx="1.5"/>`;
      svg += `<text x="${gx}" y="${H-8}" font-size="10" fill="var(--ink-soft)" text-anchor="middle">${s.label}</text>`;
    });
    svg += `</svg>`;
    svg += `<div style="display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);margin-top:4px;">
      <span style="color:var(--income);">■ Thu</span><span style="color:var(--expense);">■ Chi</span></div>`;
    $('trend-chart').innerHTML = svg;
  }

  function renderAll(){
    buildMonthOptions();
    buildCatFilterOptions();
    renderBalance();
    renderTable();
    renderCategoryBreakdown();
    renderTrendChart();
  }

  $('export-btn').addEventListener('click', ()=>{
    const backup = { initialBalance, transactions: txns };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `so-thu-chi-sao-luu-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  $('import-btn').addEventListener('click', ()=> $('import-file').click());
  $('import-file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        let list, importedInitial = null;
        if(Array.isArray(data)){
          list = data;
        }else if(data && Array.isArray(data.transactions)){
          list = data.transactions;
          if(typeof data.initialBalance === 'number') importedInitial = data.initialBalance;
        }else{
          throw new Error('bad format');
        }
        const valid = list.filter(t => t && t.date && t.type && t.category && typeof t.amount === 'number');
        if(!confirm(`Nhập ${valid.length} giao dịch và GHÉP vào dữ liệu hiện có?`)) return;
        valid.forEach(t => { if(!t.id) t.id = uid(); });
        txns = txns.concat(valid);
        save();
        if(importedInitial !== null && confirm(`Tệp này có số dư ban đầu là ${fmt(importedInitial)}. Thay số dư ban đầu hiện tại bằng giá trị này?`)){
          initialBalance = importedInitial;
          try{ localStorage.setItem(INITIAL_BAL_KEY, String(initialBalance)); }catch(e){}
        }
        renderAll();
      }catch(err){
        alert('Tệp không đúng định dạng. Vui lòng chọn tệp .json được xuất từ chính ứng dụng này.');
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  populateCategorySelect();
  renderAll();

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
